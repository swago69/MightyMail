import org.apache.commons.io.FilenameUtils

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.mrcrayfish:framework-fabric:${minecraft_version}-${framework_version}"
    compileOnly "com.mrcrayfish:refurbished_furniture-fabric:${minecraft_version}-${refurbished_furniture}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory.set(file("src/generated"))
        modId = "${mod_id}"
    }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            name("Fabric: Client")
            ideConfigGenerated(true)
        }
        server {
            name("Fabric: Server")
            ideConfigGenerated(true)
        }
        datagen {
            name("Fabric: Data")
            ideConfigGenerated(true)
        }
    }
}
