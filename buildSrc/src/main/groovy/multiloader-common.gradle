plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

version = "${mod_version}+${minecraft_version}"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

def getGprUser() {
    return project.findProperty('gpr.user') ?: System.getenv("GPR_USER")
}

def getGprKey() {
    return project.findProperty('gpr.key') ?: System.getenv("GPR_KEY")
}

def getPackagesRepo() {
    return project.findProperty('packagesRepo') ?: System.getenv("PACKAGES_REPO")
}

repositories {
    mavenCentral()
    // Resolves the locally-published 26.2 Framework fork (com.mrcrayfish:framework-*)
    // when GitHub Packages credentials for the upstream MrCrayfish repo aren't configured.
    mavenLocal()
